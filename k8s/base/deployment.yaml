# k8s/base/deployment.yaml — Base Kubernetes Deployment
# This is the BASE configuration shared by QA and Prod.
# Environment-specific overrides live in:
#   k8s/overlays/qa/   → QA-specific patches (1 replica, QA image, etc.)
#   k8s/overlays/prod/ → Prod-specific patches (3 replicas, prod image, HPA)
#
# Apply with Kustomize:
#   kubectl apply -k k8s/overlays/qa
#   kubectl apply -k k8s/overlays/prod

apiVersion: apps/v1
kind: Deployment
metadata:
  name: smartapps-service
  labels:
    app: smartapps-service
    managed-by: kustomize
spec:
  replicas: 1                         # Overridden per environment via kustomize
  selector:
    matchLabels:
      app: smartapps-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0               # Zero-downtime: never remove a pod before new one is ready
  template:
    metadata:
      labels:
        app: smartapps-service
    spec:
      serviceAccountName: smartapps-sa

      # Graceful shutdown — allow 30s for in-flight requests to complete
      terminationGracePeriodSeconds: 30

      containers:
        - name: smartapps-service
          image: IMAGE_PLACEHOLDER 
          imagePullPolicy: Always

          ports:
            - containerPort: 8080
              name: http
              protocol: TCP

          env:
            - name: PORT
              value: "8080"

          # Resource limits — prevents one pod starving others
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          # Liveness: if app deadlocks, restart the pod
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3

          # Readiness: don't send traffic until app is truly ready
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          # Graceful shutdown: stop accepting new connections before SIGTERM
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]

---
apiVersion: v1
kind: Service
metadata:
  name: smartapps-service
  labels:
    app: smartapps-service
spec:
  type: ClusterIP
  selector:
    app: smartapps-service
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: smartapps-sa
  labels:
    app: smartapps-service
