# .github/workflows/cd.yml — Continuous Delivery
# Trigger : Manual (workflow_dispatch) with version input
#           OR automatic on GitHub Release published
#
# Flow    : QA Gate Check → Human Approval → Build Prod → Push Prod ECR
#           → Deploy to EKS → Verify → (Auto-rollback on failure
#   production  → Required reviewers: devops-lead, platform-team
#                 Deployment branch: main only

name: CD — Promote to Production

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version to promote (e.g. 1.2.0)"
        required: true
        type: string
      skip_vuln_gate:
        description: "Skip ECR vulnerability gate (emergency only)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

  release:
    types: [published]

env:
  IMAGE_NAME: smartapps-service
  DOCKERFILE: docker/Dockerfile
  AWS_REGION: ${{ secrets.AWS_REGION }}

jobs:

  # ── Job 1: QA Gate Check
  # Verifies that the version being promoted was actually built and validated
  # through QA. Blocks the pipeline if the QA image does not exist.
  qa-gate:
    name: QA Gate — Verify image exists
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION=$(echo "${{ github.ref_name }}" | sed 's/^v//')
          else
            VERSION="${{ inputs.version }}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Promoting version: ${VERSION}"

      - name: Configure AWS credentials (QA role — read only)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume:    ${{ secrets.AWS_ROLE_ARN_QA }}
          aws-region:        ${{ env.AWS_REGION }}
          role-session-name: github-qa-gate-${{ github.run_id }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Check QA image exists in ECR
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          REPO="${{ secrets.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}-qa"
          TAG="${VERSION}-qa"

          echo "Checking: ${REPO}:${TAG}"

          if ! aws ecr describe-images \
              --repository-name "${{ env.IMAGE_NAME }}-qa" \
              --image-ids "imageTag=${TAG}" \
              --region "${{ env.AWS_REGION }}" > /dev/null 2>&1; then
            echo "❌ QA image not found: ${REPO}:${TAG}"
            echo "Build QA first by pushing to main branch."
            exit 1
          fi
          echo "✅ QA image confirmed: ${REPO}:${TAG}"

      - name: Check ECR vulnerability scan results
        if: inputs.skip_vuln_gate != 'true'
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          CRITICAL=$(aws ecr describe-image-scan-findings \
            --repository-name "${{ env.IMAGE_NAME }}-qa" \
            --image-id "imageTag=${VERSION}-qa" \
            --region "${{ env.AWS_REGION }}" \
            --query 'imageScanFindings.findingSeverityCounts.CRITICAL' \
            --output text 2>/dev/null || echo "0")

          echo "Critical vulnerabilities: ${CRITICAL}"

          if [ "${CRITICAL}" != "0" ] && [ "${CRITICAL}" != "None" ] && [ -n "${CRITICAL}" ]; then
            echo "❌ ${CRITICAL} CRITICAL CVEs found in QA image."
            echo "Review: aws ecr describe-image-scan-findings --repository-name ${{ env.IMAGE_NAME }}-qa --image-id imageTag=${VERSION}-qa"
            exit 1
          fi
          echo "✅ Vulnerability scan passed (0 CRITICAL findings)"

    outputs:
      version: ${{ steps.ver.outputs.version }}

  # ── Job 2: Production Deployment
  # Uses GitHub Environment protection — requires human approval from devops-lead or platform-team before this job can run.
  deploy-prod:
    name: Deploy → Production EKS
    runs-on: ubuntu-latest
    needs: qa-gate
    environment:
      name: production                 # Triggers required-reviewer approval gate
      url: https://app.smartapps.co.ke

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Configure AWS credentials (PROD role)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume:    ${{ secrets.AWS_ROLE_ARN_PROD }}
          aws-region:        ${{ env.AWS_REGION }}
          role-session-name: github-prod-deploy-${{ github.run_id }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Prod image
        uses: docker/build-push-action@v5
        with:
          context:   .
          file:      ${{ env.DOCKERFILE }}
          push:      true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ env.IMAGE_NAME }}-prod:${{ needs.qa-gate.outputs.version }}-prod
            ${{ steps.ecr-login.outputs.registry }}/${{ env.IMAGE_NAME }}-prod:latest-prod
          build-args: |
            APP_VERSION=${{ needs.qa-gate.outputs.version }}
            BUILD_ENV=prod
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Configure kubectl for EKS
        run: |
          aws eks update-kubeconfig \
            --name "${{ secrets.EKS_CLUSTER_PROD }}" \
            --region "${{ env.AWS_REGION }}"

      - name: Deploy to EKS (rolling update)
        id: deploy
        run: |
          VERSION="${{ needs.qa-gate.outputs.version }}"
          PROD_IMAGE="${{ steps.ecr-login.outputs.registry }}/${{ env.IMAGE_NAME }}-prod:${VERSION}-prod"

          echo "Deploying: ${PROD_IMAGE}"

          kubectl set image deployment/${{ env.IMAGE_NAME }} \
            ${{ env.IMAGE_NAME }}="${PROD_IMAGE}" \
            --namespace prod

          kubectl annotate deployment/${{ env.IMAGE_NAME }} \
            kubernetes.io/change-cause="version=${VERSION} sha=${{ github.sha }} actor=${{ github.actor }}" \
            --namespace prod \
            --overwrite

          echo "prod_image=${PROD_IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Wait for rollout
        id: rollout
        run: |
          if ! kubectl rollout status deployment/${{ env.IMAGE_NAME }} \
              --namespace prod \
              --timeout=300s; then
            echo "rollout_failed=true" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "rollout_failed=false" >> "$GITHUB_OUTPUT"

      - name: Auto-rollback on failure
        if: failure() && steps.rollout.outputs.rollout_failed == 'true'
        run: |
          echo "⚠️  Rollout failed — triggering automatic rollback"
          kubectl rollout undo deployment/${{ env.IMAGE_NAME }} --namespace prod
          kubectl rollout status deployment/${{ env.IMAGE_NAME }} --namespace prod --timeout=120s
          echo "✅ Rollback complete"

      - name: Post-deploy verification
        run: |
          echo "Current deployment state:"
          kubectl get pods -n prod -l app=${{ env.IMAGE_NAME }}
          echo ""
          echo "Active image:"
          kubectl get deployment/${{ env.IMAGE_NAME }} -n prod \
            -o jsonpath='{.spec.template.spec.containers[0].image}'

      - name: Deployment summary
        run: |
          echo "## 🚀 Production Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Version | ${{ needs.qa-gate.outputs.version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Image | \`${{ steps.deploy.outputs.prod_image }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Approved by | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Timestamp | $(date -u) |" >> $GITHUB_STEP_SUMMARY
