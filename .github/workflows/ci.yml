
# .github/workflows/ci.yml — Continuous Integration
# Trigger : Every push to main or any feature branch + Pull Requests
# Does    : Lint → Unit Test → Build Docker image → Push to QA ECR

name: CI — Build & Push to QA

on:
  push:
    branches: [ "main", "develop", "feature/**", "fix/**" ]
  pull_request:
    branches: [ "main" ]

# Cancel in-progress runs on the same branch when a new push arrives
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME:  smartapps-service
  DOCKERFILE:  docker/Dockerfile
  AWS_REGION:  ${{ secrets.AWS_REGION }}

jobs:

  # Job 1: Lint & Unit Tests
  test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test -- --coverage --ci

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: app/coverage/

  # Job 2: Build & Push to QA ECR
  build-push-qa:
    name: Build & Push → QA ECR
    runs-on: ubuntu-latest
    needs: test                         # Only runs if tests pass
    if: github.ref == 'refs/heads/main' # Only on pushes to main

    permissions:
      id-token: write    # Required for OIDC authentication to AWS
      contents: read

    outputs:
      image_tag:  ${{ steps.meta.outputs.version }}
      full_image: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Derive semantic version
        id: version
        run: |
          # Use git tag if available, otherwise derive from package.json + commit SHA
          if git describe --tags --exact-match 2>/dev/null; then
            VERSION=$(git describe --tags --exact-match | sed 's/^v//')
          else
            PKG_VERSION=$(node -p "require('./app/package.json').version")
            SHORT_SHA=$(git rev-parse --short HEAD)
            VERSION="${PKG_VERSION}-${SHORT_SHA}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Derived version: ${VERSION}"

      - name: Configure AWS credentials (OIDC — no static keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume:    ${{ secrets.AWS_ROLE_ARN_QA }}
          aws-region:        ${{ env.AWS_REGION }}
          role-session-name: github-actions-ci-${{ github.run_id }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Extract Docker metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.ecr-login.outputs.registry }}/${{ env.IMAGE_NAME }}-qa
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}-qa
            type=raw,value=latest-qa

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push to QA ECR
        uses: docker/build-push-action@v5
        with:
          context:   .
          file:      ${{ env.DOCKERFILE }}
          push:      true
          tags:      ${{ steps.meta.outputs.tags }}
          labels:    ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
            BUILD_ENV=qa
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Validate pushed image (health check)
        run: |
          FULL_IMAGE="${{ steps.ecr-login.outputs.registry }}/${{ env.IMAGE_NAME }}-qa:${{ steps.version.outputs.version }}-qa"
          echo "Pulling and running: $FULL_IMAGE"

          docker pull "$FULL_IMAGE"
          CONTAINER_ID=$(docker run -d --rm -p 18080:8080 \
            -e APP_ENV=qa \
            -e APP_VERSION="${{ steps.version.outputs.version }}" \
            "$FULL_IMAGE")

          echo "Container started: ${CONTAINER_ID:0:12}"
          sleep 6

          HTTP=$(curl -sf -o /dev/null -w "%{http_code}" http://localhost:18080/health || echo "000")
          docker stop "$CONTAINER_ID" || true

          if [ "$HTTP" != "200" ]; then
            echo "Health check FAILED: HTTP $HTTP"
            exit 1
          fi
          echo "Health check PASSED: HTTP $HTTP"

      - name: Summary
        run: |
          echo "## ✅ QA Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Version | ${{ steps.version.outputs.version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Image | \`${{ steps.meta.outputs.tags }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Triggered by | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
